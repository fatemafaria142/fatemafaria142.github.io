short_bio: >-
  <p>
    Greetings! 🙋‍♀️ I am <strong>Fatema Tuj Johora Faria</strong>, and I earned a Bachelor of Science in Computer Science
    and Engineering from
    <a href="https://www.aust.edu/" target="_blank">Ahsanullah University of Science and Technology</a>,
    Dhaka, Bangladesh.
  </p>
  <p class="mb-3">
    I like turning messy, ambiguous business problems into reliable AI systems that people actually trust in production. Over the last 2.5 years, I've gained expertise in working with Multi-Agent Systems, Retrieval-Augmented Generation (RAG) Pipelines, Model Context Protocol (MCP), and LLMOps Infrastructure to build and ship production-grade systems for scalable, real-world deployments.
  </p>
  <blockquote class="bio-quote mb-3">
    Currently studying the security and safety issues of long-horizon LLM-based agents.
  </blockquote>

  <div class="h5 mt-3 mb-2">Research Interests</div>

  <div class="research-interests-cols mb-0">
    <ul>
      <li>Large Language Models</li>
      <li>Vision-Language Models</li>
      <li>AI Agents</li>
    </ul>
    <ul>
      <li>Trustworthy AI</li>
      <li>AI Security</li>
      <li>AI Safety</li>
    </ul>
  </div>

  <div class="collab-note mt-1">
    <i class="fas fa-comments"></i><strong>I am always happy to collaborate, exchange ideas, and learn about new research directions.</strong>
    Please feel free to reach out to me at <a href="mailto:fatema.faria142@gmail.com">fatema.faria142@gmail.com</a> (personal) or
    <a href="mailto:ftj.faria@asthait.com">ftj.faria@asthait.com</a> (official).
    For a detailed overview of my experience and qualifications: <a class="ml-1" target="_blank" href="/files/CV/CV_of_Fatema_Tuj_Johora_Faria.pdf"><i class="fas fa-file-alt"></i> Curriculum Vitae</a>
  </div>

