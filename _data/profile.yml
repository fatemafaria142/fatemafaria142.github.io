short_bio: >-
  <p>
    Hi! I am <strong>Fatema Tuj Johora Faria</strong>, currently working as an <strong>AI Engineer II</strong> at
    <a href="https://www.linkedin.com/company/asthait/" target="_blank">Astha.IT</a>. I design, develop, and deploy
    generative AI applications with a strong focus on Large Language Models, Large Multimodal Models, and
    Retrieval-Augmented Generation (RAG). My work spans building LLM-based agents, multimodal AI agents, and
    multi-agent architectures that automate complex tasks and enable data-driven insights. In my current role, I
    leverage cloud infrastructure such as AWS S3, EC2, ECR, and App Runner to build scalable, efficient, and
    reliable AI systems, while also focusing on user-friendly interfaces that make AI interactions intuitive.
  </p>
  <p>
    Previously, as <strong>Senior Application Developer</strong> at
    <a href="https://www.linkedin.com/company/dexiansolutions/" target="_blank">Dexian (Bangladesh) Limited</a>,
    I led the architecture of generative AI systems for production-grade deployment using Azure OpenAI, Azure SQL,
    Azure Blob Storage, and AlloyDB for high-performance vector search, oversaw proof-of-concept development to
    translate stakeholder requirements into feasible solutions, and mentored junior developers on coding standards
    and architectural best practices.
  </p>
  <p>
    <strong>Research interests:</strong> Large Language Models, Large Multimodal Models, LLM &amp; Multimodal AI
    Agents, Human&ndash;AI Interaction, NLP for Social Good, NLP for Low-Resource Languages, AI in Healthcare,
    Vision-Language Models, Trustworthy AI, and Computer Vision.
  </p>
  <p>
    I am open to collaborative opportunities that align with my research goals. Feel free to reach out at
    <a href="mailto:fatema.faria142@gmail.com">fatema.faria142@gmail.com</a> (personal) or
    <a href="mailto:ftj.faria@asthait.com">ftj.faria@asthait.com</a> (official).
  </p>

