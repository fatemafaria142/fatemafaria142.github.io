short_bio: >-
  <p>
    Greetings! I am <strong>Fatema Tuj Johora Faria</strong>, and I earned a Bachelor of Science in Computer Science
    and Engineering from
    <a href="https://www.aust.edu/" target="_blank">Ahsanullah University of Science and Technology</a>,
    Dhaka, Bangladesh.
  </p>
  <p>
    I am currently working as an <strong>AI Engineer II</strong> at
    <a href="https://www.linkedin.com/company/asthait/" target="_blank">Astha.IT</a>, where I bring around
    <strong>2.5 years of full stack experience in AI applications</strong>. My work focuses on
    architecting, developing, and deploying production-grade agentic solutions. I have hands-on experience
    with <strong>Microsoft Azure</strong>, <strong>Amazon Web Services (AWS)</strong>, and
    <strong>Google Cloud Platform (GCP)</strong> for building scalable, robust, and high-performance systems,
    while also focusing on user-friendly interfaces that make AI interactions intuitive.
  </p>
  <p class="mb-2"><strong>Research Interests</strong></p>

  <p class="mb-1"><strong>AI Reasoning &amp; Autonomy:</strong> LLM Reasoning, AI Agents, Multimodal AI</p>
  <ul class="mb-3">
    <li><strong>LLM Reasoning:</strong> Investigating how large language models can achieve reliable, structured, and multi-step reasoning for tackling challenging real-world scenarios.</li>
    <li><strong>AI Agents:</strong> Examining how AI agents can plan, use tools, collaborate, and adapt to orchestrate complex tasks in dynamic environments.</li>
    <li><strong>Multimodal AI:</strong> Investigating how multimodal models can integrate and reason across diverse modalities (text + images/videos) to improve contextual understanding and decision-making.</li>
  </ul>

  <p class="mb-1"><strong>Safety, Security, &amp; Alignment:</strong> Trustworthy AI, AI Security</p>
  <ul class="mb-3">
    <li><strong>Trustworthy AI:</strong> Investigating how AI systems can achieve fairness, explainability, reliability, and accountability across real-world settings.</li>
    <li><strong>AI Security:</strong> Exploring how language models can withstand adversarial attacks, prompt injection, malicious inputs, and other threats to their reliability and integrity.</li>
  </ul>

  <p class="mb-1"><strong>Domain-Specific AI Applications:</strong> AI for Databases (NL2SQL/NoSQL), AI for Social Good</p>
  <ul class="mb-0">
    <li><strong>AI for Databases:</strong> Investigating how AI can translate user natural language into SQL/NoSQL queries, reason over database schemas, and improve access to structured data across different use cases.</li>
    <li><strong>AI for Social Good:</strong> Exploring how AI can be designed and applied to address societal challenges through accessible, scalable, and impactful solutions.</li>
  </ul>

