short_bio: >-
  <p>
    Greetings! I am <strong>Fatema Tuj Johora Faria</strong>, and I earned a Bachelor of Science in Computer Science
    and Engineering from
    <a href="https://www.aust.edu/" target="_blank">Ahsanullah University of Science and Technology</a>,
    Dhaka, Bangladesh.
  </p>
  <p>
    I am currently working as an <strong>AI Engineer II</strong> at
    <a href="https://www.linkedin.com/company/asthait/" target="_blank">Astha.IT</a>. My work focuses on designing,
    developing, and deploying production-grade Agentic AI applications. I build intelligent agents that perform
    multi-step reasoning, tool use, retrieval, and task orchestration across heterogeneous data sources to automate
    complex business workflows. I have hands-on experience with <strong>Microsoft Azure</strong>,
    <strong>Amazon Web Services (AWS)</strong>, and <strong>Google Cloud Platform (GCP)</strong> for building
    scalable, reliable, and production-ready AI systems, while also focusing on user-friendly interfaces that make
    AI interactions intuitive.
  </p>
  <p class="mb-2"><strong>Research Interests</strong></p>

  <p class="mb-1"><strong>AI Reasoning &amp; Autonomy:</strong> LLM Reasoning, AI Agents, Multimodal AI</p>
  <ul class="mb-3">
    <li>Investigating LLM Reasoning to develop models capable of structured, multi-step reasoning, complex problem-solving, and reliable decision-making.</li>
    <li>Developing AI Agents that leverage reasoning, planning, tool use, and task orchestration to automate complex tasks and workflows.</li>
    <li>Exploring Multimodal AI to enable models to reason across language, vision, and heterogeneous information sources for more capable and context-aware AI systems.</li>
  </ul>

  <p class="mb-1"><strong>Safety, Security, &amp; Alignment:</strong> Trustworthy AI, AI Security</p>
  <ul class="mb-3">
    <li>Investigating Trustworthy AI to develop reliable, robust, interpretable, and responsible AI systems for real-world deployment.</li>
    <li>Exploring AI Security to improve the resilience of AI systems against adversarial threats, vulnerabilities, misuse, and security risks.</li>
  </ul>

  <p class="mb-1"><strong>Domain-Specific AI Applications:</strong> AI for Databases (NL2SQL/NoSQL), AI for Social Good</p>
  <ul class="mb-0">
    <li>Developing AI for Databases systems that translate natural-language queries into SQL/NoSQL and enable more intuitive interaction with structured data.</li>
    <li>Applying AI for Social Good to address real-world challenges through practical and accessible AI solutions, particularly in domains where AI can create meaningful societal impact.</li>
  </ul>

